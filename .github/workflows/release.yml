name: semantic-release

on:
  push:
    branches: [ main ]
    paths: [ 'desktop/*' ]

jobs:
  release_draft:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'
      - name: Install dependencies
        run: yarn --frozen-lockfile
      - name: Build
        run: yarn make
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: yarn semantic-release
