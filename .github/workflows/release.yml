name: Desktop Release

on:
  push:
    branches: [ main ]
    paths: [ 'desktop/**' ]

defaults:
  run:
    working-directory: desktop

jobs:
  macos:
    name: MacOS Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'
      # - run: corepack enable
      - name: Install dependencies
        run: yarn --frozen-lockfile
      - name: Install dependencies
        run: yarn --frozen-lockfile
      - name: Build
        run: yarn make
      - name: Setup semantic-release
        run: |
          yarn install -g -D @semantic-release/commit-analyzer
          yarn install -g -D @semantic-release/release-notes-generator
          yarn install -g -D @semantic-release/github
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
