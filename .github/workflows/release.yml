name: Desktop Release

on:
  push:
    branches: [ main ]
    # paths: [ 'desktop/**' ]
  workflow_dispatch:
    inputs:
      windows_pfx_file:
        required: true
      windows_pfx_password:
        required: true

jobs:
  staging:
    uses: ./.github/workflows/reusable_release.yml
    with:
      runs-on: ubuntu-latest
      group_id: 2
      api_origin: http://ias1-staging1-srvus-pub-alb-1167594217.ap-northeast-1.elb.amazonaws.com
    secrets:
      cognito_auth_region: ${{ secrets.STAGING_COGNITO_AUTH_REGION }}
      cognito_auth_user_pool_id: ${{ secrets.STAGING_COGNITO_AUTH_USER_POOL_ID }}
      cognito_auth_user_pool_web_client_id: ${{ secrets.STAGING_COGNITO_AUTH_USER_POOL_WEB_CLIENT_ID }}
      windows_pfx_file: ${{ inputs.windows_pfx_file }}
      windows_pfx_password: ${{ inputs.windows_pfx_password }}

