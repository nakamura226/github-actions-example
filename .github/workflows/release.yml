name: Desktop Release

on:
  push:
    branches: [ main ]
    # paths: [ 'desktop/**' ]
  workflow_dispatch:

defaults:
  run:
    working-directory: desktop

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'
      - name: Install Yarn
        run: npm install -g yarn
      - name: Install dependencies
        run: yarn --frozen-lockfile
      - name: Install wine64 for windows
        run: |
          sudo apt-get -y update
          sudo apt-get -y install wine64
      - name: Release
        env:
          GITHUB_TOKEN: github_pat_11AEDPXDA0SrVB4vvGlbzb_cdBaxXBKQRujqW5NN9ezdnR1UXWmQqPxoGw0YSirdGGYI3VBLXCAx8kuED
        run: npx semantic-release --debug
