name: Desktop Release

on:
  push:
    branches: [ main ]
    # paths: [ 'desktop/**' ]
  workflow_dispatch:

defaults:
  run:
    working-directory: desktop

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Install wine64 for windows
      run: |
        sudo apt-get -y update
        sudo apt-get -y install wine64

    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '16'

    - name: Install Yarn
      run: npm install -g yarn

    - name: Install dependencies
      run: yarn --frozen-lockfile

    - name: Package release for staging
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REACT_APP_API_ORIGIN: '2'
        REACT_APP_AUTH_REGION: http://ias1-staging1-srvus-pub-alb-1167594217.ap-northeast-1.elb.amazonaws.com
        REACT_APP_AUTH_USER_POOL_ID: ${{ secrets.STAGE_COGNITO_AUTH_REGION }}
        REACT_APP_AUTH_USER_POOL_WEB_CLIENT_ID: ${{ secrets.STAGE_COGNITO_AUTH_USER_POOL_ID }}
        REACT_APP_GROUP_ID: ${{ secrets.STAGE_COGNITO_AUTH_USER_POOL_WEB_CLIENT_ID }}
      run: npx semantic-release --debug --tag-format='releases/uploader-ui/v${version}-staging'

    - name: Package release for production
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REACT_APP_API_ORIGIN: '2'
        REACT_APP_AUTH_REGION: http://ias1-staging1-srvus-pub-alb-1167594217.ap-northeast-1.elb.amazonaws.com
        REACT_APP_AUTH_USER_POOL_ID: ${{ secrets.COGNITO_AUTH_REGION }}
        REACT_APP_AUTH_USER_POOL_WEB_CLIENT_ID: ${{ secrets.COGNITO_AUTH_USER_POOL_ID }}
        REACT_APP_GROUP_ID: ${{ secrets.COGNITO_AUTH_USER_POOL_WEB_CLIENT_ID }}
      run: npx semantic-release --debug --tag-format='releases/uploader-ui/v${version}'
