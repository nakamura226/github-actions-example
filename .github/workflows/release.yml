name: Desktop Release

on:
  push:
    branches: [ main ]
    # paths: [ 'desktop/**' ]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: ./.github/workflows/setup.yml
      with:
        runs-on: ubuntu-latest
    - name: Package for staging
      env:
        NODE_ENV: staging
        GROUP_ID: '2'
        API_ORIGIN: http://ias1-staging1-srvus-pub-alb-1167594217.ap-northeast-1.elb.amazonaws.com
        COGNITO_AUTH_REGION: ${{ secrets.STAGE_COGNITO_AUTH_REGION }}
        COGNITO_AUTH_USER_POOL_ID: ${{ secrets.STAGE_COGNITO_AUTH_USER_POOL_ID }}
        COGNITO_AUTH_USER_POOL_WEB_CLIENT_ID: ${{ secrets.STAGE_COGNITO_AUTH_USER_POOL_WEB_CLIENT_ID }}
      run: yarn package:mac && yarn package:mac:zip & yarn package:win && yarn package:win:zip
    - name: Package for production
      env:
        NODE_ENV: production
        GROUP_ID: '2'
        API_ORIGIN: http://ias1-staging1-srvus-pub-alb-1167594217.ap-northeast-1.elb.amazonaws.com
        COGNITO_AUTH_REGION: ${{ secrets.COGNITO_AUTH_REGION }}
        COGNITO_AUTH_USER_POOL_ID: ${{ secrets.COGNITO_AUTH_USER_POOL_ID }}
        COGNITO_AUTH_USER_POOL_WEB_CLIENT_ID: ${{ secrets.COGNITO_AUTH_USER_POOL_WEB_CLIENT_ID }}
      run: yarn package:mac && yarn package:mac:zip & yarn package:win && yarn package:win:zip
    - name: Package Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: npx semantic-release --debug
