name: Reusable Desktop Package Workflow

on:
  workflow_call:
    inputs:
      runs-on:
        type: string
        required: true
        default: ubuntu-latest
      group_id:
        type: string
        required: true
      api_origin:
        type: string
        required: true
    secrets:
      cognito_auth_region:
        required: true
      cognito_auth_user_pool_id:
        required: true
      cognito_auth_user_pool_web_client_id:
        required: true

defaults:
  run:
    working-directory: desktop

jobs:
  package:
    name: Package
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'
      - name: Install Yarn
        run: npm install -g yarn
      - name: Install dependencies
        run: yarn --frozen-lockfile
      - name: Install wine64 for windows
        run: |
          sudo apt-get -y update
          sudo apt-get -y install wine64
        if: ${{ inputs.runs-on == 'ubuntu-latest' }}
      - name: Package for MacOS
        run: yarn package:mac && yarn package:mac:zip
      - name: Package for Windows
        run: yarn package:win && yarn package:win:zip
