name: Desktop make

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      windows_pfx_file:
        required: true
      windows_pfx_password:
        required: true

jobs:
  make:
    runs-on: windows-latest
    steps:
      - name: Checkout
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone https://github.com:${{ github.repository }}.git C:/github-actions-example
          git checkout ${{ github.ref_name }}
          cd desktop
          ls -la

