name: Desktop make

on:
  workflow_dispatch:
    inputs:
      windows_pfx_file:
        required: true
      windows_pfx_password:
        required: true

defaults:
  run:
    working-directory: desktop

jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: GitHub Tag Name example
        run: |
          echo "Ref from github.ref: ${{  github.ref }}"
          echo "Tag name from github.ref_name: ${{  github.ref_name }}"
          echo "windows_pfx_file: ${{  inputs.windows_pfx_file }}"
          echo "windows_pfx_password: ${{  inputs.windows_pfx_password }}"

      - name: Get package version
        id: package-version
        uses: martinbeentjes/npm-get-version-action@main

      - name: Create release uploader v${{ steps.package-version.outputs.current-version }}
        run: |
          echo "package version: ${{ steps.package-version.outputs.current-version }}"
